<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Invasive Species – Camera</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="public/styles.css" />
  <link rel="icon" href="public/InvasiveLogo.jpg" />
</head>
<body class="camera-page">

  <nav>
    <div class="logo" style="color:black; font-size:2.4rem; font-weight:900; letter-spacing:-1px; display:flex; align-items:center; gap:4px;">
      <span style="font-family:'Circular','Spotify Circular','SpotifySans',Arial,Helvetica,sans-serif;">Invasiv</span>
      <img src="public/InvasiveLogo.jpg" alt="Logo" style="vertical-align:middle; transform:rotate(60deg); width:50px; height:auto;" />
    </div>
    <div class="links">
      <a href="index.html">Map</a>
      <a href="camera.html" class="active">Upload</a>
      <a href="chat.html">Chat</a>
    </div>
  </nav>

  <main class="camera-main" id="cameraMain">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" class="hidden" aria-hidden="true"></canvas>
    <div id="flash" class="flash-overlay" aria-hidden="true"></div>
    <div id="camera-error" class="camera-error hidden"></div>
    <button id="snap" class="capture-btn" aria-label="Capture photo"></button>
    <div class="rotate-overlay" id="rotateOverlay">
      <div>Please rotate your device to <strong>portrait</strong> for the camera.</div>
    </div>
  </main>

  <div class="bottom-nav" id="bottomNav">
    <a href="index.html">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
             class="bi bi-globe-europe-africa-fill" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
                d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0m0 1a6.97 6.97 0 0 0-4.335 1.505l-.285.641a.847.847 0 0 0 1.48.816l.244-.368a.81.81 0 0 1 1.035-.275.81.81 0 0 0 .722 0l.262-.13a1 1 0 0 1 .775-.05l.984.34q.118.04.243.054c.784.093.855.377.694.801a.84.84 0 0 1-1.035.487l-.01-.003C8.273 4.663 7.747 4.5 6 4.5 4.8 4.5 3.5 5.62 3.5 7c0 3 1.935 1.89 3 3 1.146 1.194-1 4 2 4 1.75 0 3-3.5 3-4.5 0-.704 1.5-1 1-2.5-.097-.291-.396-.568-.642-.756-.173-.133-.206-.396-.051-.55a.334.334 0 0 1 .42-.043l1.085.724a.276.276 0 0 0 .348-.035c.15-.15.414-.083.488.117.16.428.445 1.046.847 1.354A7 7 0 0 0 8 1"/>
        </svg>
      </span>
    </a>
    <a href="camera.html" class="active">
      <span class="icon-bg"></span>
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
             class="bi bi-camera-fill" viewBox="0 0 16 16">
          <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
          <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
        </svg>
      </span>
    </a>
    <a href="chat.html">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
             class="bi bi-chat-dots-fill" viewBox="0 0 16 16">
          <path d="M16 8c0 3.866-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7M5 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0m4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
        </svg>
      </span>
    </a>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <section id="speciesSheet" class="bottom-sheet" aria-hidden="true" aria-label="Species details">
    <header class="sheet-header">
      <div class="sheet-grabber"></div>
      <h3 id="speciesTitle">Species</h3>
      <button id="sheetClose" class="sheet-close" aria-label="Close">✕</button>
    </header>
    <div id="speciesBody" class="sheet-body">
    </div>
  </section>
  <script src="camera.js" defer></script>
</body>
</html>
