<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invasive Species • Chat</title>
  <link rel="stylesheet" href="public/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Circular:400,700&display=swap">
  <link rel="icon" href="public/InvasiveLogo.jpg">

  <style>
    .message {
      opacity: 0;
      transform: translateY(8px);
      animation: fadeIn 0.22s forwards ease-out;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .typing {
      background: var(--light-green, #d7f5d4);
      color: #222;
      align-self: flex-start;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #4c4c4c;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo" style="color:black; font-size:2.4rem; font-weight:900; letter-spacing:-1px; display:flex; align-items:center; gap:4px;">
      <span style="font-family:'Circular','Spotify Circular','SpotifySans',Arial,Helvetica,sans-serif;">Invasiv</span>
      <img src="public/InvasiveLogo.jpg" alt="Logo" style="vertical-align:middle; transform:rotate(60deg); width:50px; height:auto;" />
    </div>
    <div class="links">
      <a href="index.html">Map</a>
      <a href="camera.html">Upload</a>
      <a href="chat.html" class="active">Chat</a>
    </div>
  </nav>
  <div class="chat-container">
    <div class="messages" role="log" aria-live="polite" aria-relevant="additions">
      <div class="message bot">
        Hello! I am an automated assistant designed to help you analyze data related to invasive species. How may I assist you today?
      </div>
    </div>

    <form class="chat-input" autocomplete="off">
      <input type="text" placeholder="Type a message..." aria-label="Message" />
      <button type="submit" aria-label="Send">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </div>
  <div class="bottom-nav">
    <a href="index.html">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-globe-europe-africa-fill" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0m0 1a6.97 6.97 0 0 0-4.335 1.505l-.285.641a.847.847 0 0 0 1.48.816l.244-.368a.81.81 0 0 1 1.035-.275.81.81 0 0 0 .722 0l.262-.13a1 1 0 0 1 .775-.05l.984.34q.118.04.243.054c.784.093.855.377.694.801a.84.84 0 0 1-1.035.487l-.01-.003C8.273 4.663 7.747 4.5 6 4.5 4.8 4.5 3.5 5.62 3.5 7c0 3 1.935 1.89 3 3 1.146 1.194-1 4 2 4 1.75 0 3-3.5 3-4.5 0-.704 1.5-1 1-2.5-.097-.291-.396-.568-.642-.756-.173-.133-.206-.396-.051-.55a.334.334 0 0 1 .42-.043l1.085.724a.276.276 0 0 0 .348-.035c.15-.15.414-.083.488.117.16.428.445 1.046.847 1.354A7 7 0 0 0 8 1"/>
        </svg>
      </span>
    </a>
    <a href="camera.html">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-camera-fill" viewBox="0 0 16 16">
          <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
          <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
        </svg>
      </span>
    </a>
    <a href="chat.html" class="active">
      <span class="icon-bg"></span>
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-chat-dots-fill" viewBox="0 0 16 16">
          <path d="M16 8c0 3.866-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7M5 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0m4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
        </svg>
      </span>
    </a>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const messagesEl = document.querySelector('.messages');
      const form = document.querySelector('.chat-input');
      const input = form.querySelector('input[type="text"]');

      function appendMessage(text, role) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user' ? 'user' : 'bot');
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function showTyping() {
        const typingEl = document.createElement('div');
        typingEl.className = 'typing';
        typingEl.innerHTML = `
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        `;
        typingEl.dataset.typing = "true";
        messagesEl.appendChild(typingEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return typingEl;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = (input.value || '').trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';
        input.focus();

        const typingEl = showTyping();

        try {
          const resp = await fetch('https://nonlaying-unjilted-johnathan.ngrok-free.dev/api/v1/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json',
                      'Bypass-Tunnel-Reminder': 'true'
             },
            body: JSON.stringify({ message: text })
          });

          if (!resp.ok) {
            typingEl.remove();
            appendMessage('Server error. Please try again later.', 'bot');
            return;
          }

          const data = await resp.json();
          typingEl.remove();
          appendMessage(data.response || "No response field found.", 'bot');

        } catch (err) {
          console.error('Chat request failed:', err);
          typingEl.remove();
          appendMessage('Unable to reach server. Check that the backend is running.', 'bot');
        }
      });
    });
  </script>
</body>
</html>
